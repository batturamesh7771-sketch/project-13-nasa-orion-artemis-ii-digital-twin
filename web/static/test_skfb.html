<!DOCTYPE html>
<html>
<head>
  <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
</head>
<body>
  <iframe id="api-frame" style="width:800px; height:600px;" src="https://sketchfab.com/models/0e77e7d4ab35453e834f614f6ebbe708/embed"></iframe>
  <script>
    window.sketchfabNodes = null;
    window.sketchfabReady = false;
    const iframe = document.getElementById('api-frame');
    const client = new Sketchfab('1.12.1', iframe);
    client.init('0e77e7d4ab35453e834f614f6ebbe708', {
      success: function(api) {
        window.api = api;
        api.start();
        api.addEventListener('viewerready', function() {
          window.sketchfabReady = true;
          api.getNodeMap(function(err, nodes) {
            window.sketchfabNodes = nodes;
          });
        });
      },
      error: function() {
        window.sketchfabError = true;
      }
    });
  </script>
</body>
</html>
